services:
  house-planner:
    build: .
    image: house-planner:latest
    ports:
      - "${HOUSE_PORT:-8080}:8080"
    environment:
      HOUSE_PASSWORD: ${HOUSE_PASSWORD:-}
      HOUSE_SETUP_KEY: ${HOUSE_SETUP_KEY:-}
      HOUSE_DEMO: ${HOUSE_DEMO:-}
    volumes:
      - house-data:/var/lib/house-planner
    restart: unless-stopped

volumes:
  house-data:
