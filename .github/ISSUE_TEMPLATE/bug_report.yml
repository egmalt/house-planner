name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. English or Russian is fine. Do not post passwords, cookie tokens, real addresses or cadastral numbers. Security problems go to a private report, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open «План»
        2. Draw a wall …
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - 2D plan editor
        - 3D
        - Map
        - Estimate / catalog / Petrovich cart
        - Networks (sewer, electrical, water, underfloor heating)
        - Versions, login, saving
        - Setup / deploy / Docker
        - Scripts (plan-pull, plan-push, plan-validate)
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it running
      options:
        - Docker
        - Shared hosting (Apache / LiteSpeed)
        - nginx
        - Local php -S
        - Other
  - type: input
    id: versions
    attributes:
      label: Versions
      description: House Planner version or commit, PHP version, browser and OS.
      placeholder: 0.1.0, PHP 8.3, Chrome 140 on macOS
  - type: textarea
    id: plan
    attributes:
      label: Plan fragment or screenshot
      description: A minimal JSON fragment that reproduces the problem, a screenshot, or the browser console error. Remove personal data.
  - type: textarea
    id: logs
    attributes:
      label: Server response or logs
      description: HTTP status and error code from the API, or `docker compose logs` output.
      render: text
